services:
  app-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    command: sh -c "npm install && npm run dev -- --host"
    profiles: ["dev"]

  app-prod:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "8080:80"
    profiles: ["prod-preview"]

volumes:
  node_modules:
