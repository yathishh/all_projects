# ============================================================
# Liquibase CI/CD Infrastructure - Inventory
# ============================================================
# Replace the IPs below with your actual server IPs

[postgresql]
db-server ansible_host=192.168.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[migration]
migration-server ansible_host=192.168.1.20 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[github_runner]
cicd-server ansible_host=192.168.1.30 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
